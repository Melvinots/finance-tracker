<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceTracker</title>
    <base href="/" />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FinanceTracker.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash" role="status" aria-live="polite">

            <div class="splash-brand">
                <span class="splash-dot"></span>
                <span class="splash-name">FinanceTracker</span>
            </div>

            <div class="splash-spinner" aria-hidden="true"></div>

            <div class="splash-text">Loading...</div>

        </div>

        <style>
            .splash {
                --splash-primary: #3B5BDB;
                --splash-track: #E2E8F0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                min-height: 100vh;
                background: #F8FAFF;
            }

            .splash-brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .splash-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--splash-primary);
                animation: splash-pulse 1.5s ease-in-out infinite;
            }

            .splash-name {
                color: #1E293B;
                font-family: Georgia, serif;
                font-size: 1.4rem;
            }

            .splash-spinner {
                width: 40px;
                height: 40px;
                border: 3px solid var(--splash-track);
                border-top-color: var(--splash-primary);
                border-radius: 50%;
                animation: splash-spin 1s linear infinite;
            }

            .splash-text {
                color: #94A3B8;
                font-family: monospace;
                font-size: .7rem;
                letter-spacing: .08em;
                text-transform: uppercase;
            }


            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes splash-pulse {
                0%, 100% {
                    opacity: 1;
                }

                50% {
                    opacity: .5;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .splash-dot {
                    animation: none;
                }

                .splash-spinner {
                    animation-duration: 3s;
                }
            }
        </style>
    </div>


    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!--<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>-->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
                                window.localStorage_set = (key, value) => localStorage.setItem(key, value);
                                window.localStorage_get = (key) => localStorage.getItem(key);
                                window.localStorage_remove = (key) => localStorage.removeItem(key);
    </script>

    <script>
                                window.downloadFile = (fileName, base64) => {
                                    const link = document.createElement("a");

                                    link.href = `data:text/csv;base64,${base64}`;
                                    link.download = fileName;

                                    document.body.appendChild(link);
                                    link.click();
                                    link.remove();
                                };
    </script>
</body>

</html>

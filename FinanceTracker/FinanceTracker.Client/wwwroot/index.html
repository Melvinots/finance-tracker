<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceTracker</title>
    <base href="/" />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FinanceTracker.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="
        display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:24px;min-height:100vh;
        background:#F8FAFF;">
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:10px;height:10px;border-radius:50%;
                background:#3B5BDB;animation:p 1.5s ease-in-out infinite">
                </div>
                <span style="font-family:Georgia,serif;font-size:1.4rem;color:#1E293B">
                    FinanceTracker
                </span>
            </div>
            <div style="width:40px;height:40px;border-radius:50%;
            border:2px solid transparent;border-top-color:#3B5BDB;
            animation:s 1s linear infinite">
            </div>
            <div style="font-family:monospace;font-size:0.7rem;
            color:#94A3B8;letter-spacing:0.08em;text-transform:uppercase">
                Loading...
            </div>
        </div>
        <style>
            @keyframes s {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes p {
                0%,100% {
                    opacity: 1
                }

                50% {
                    opacity: 0.5
                }
            }
        </style>
    </div>

    <!--<div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>-->

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <!--<script src="_framework/blazor.web.js"></script>-->
    <script>
        window.localStorage_set = (key, value) => localStorage.setItem(key, value);
        window.localStorage_get = (key) => localStorage.getItem(key);
        window.localStorage_remove = (key) => localStorage.removeItem(key);
    </script>
    <script>
        window.downloadFile = (fileName, base64) => {
            const link = document.createElement("a");

            link.href = `data:text/csv;base64,${base64}`;
            link.download = fileName;

            document.body.appendChild(link);
            link.click();
            link.remove();
        };
    </script>
</body>

</html>
